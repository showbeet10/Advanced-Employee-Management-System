{% extends "base.html" %} 
{% block content %}
<div class="container py-5 fade-in-up">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card shadow-sm border-0 rounded-4">
        <div class="card-header bg-white border-bottom-0 pt-4 pb-0">
          <h3 class="mb-0">Add Department</h3>
        </div>
        <div class="card-body p-4">
          <form action="{{ url_for('department.department_add') }}" method="POST">
              <div class="mb-3">
                  <label class="form-label fw-semibold">Department Name</label>
                  <input type="text" name="name" class="form-control" required placeholder="e.g. Engineering">
              </div>
              <div class="mb-4">
                  <label class="form-label fw-semibold">Description</label>
                  <textarea name="description" class="form-control" rows="3" placeholder="Optional description of this department's role"></textarea>
              </div>
              <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary hover-scale w-50">Submit</button>
                <a href="{{ url_for('department.department_list') }}" class="btn btn-outline-secondary w-50">Cancel</a>
              </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
